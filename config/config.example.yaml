# BoarderCollie example config.
# Paths: where genomes, cleaned genomes and records are kept (library_dir),
# where read-alignment indexes are written (index_dir), scratch (work_dir),
# and the FCS-GX database.
library_dir: /path/to/host_genomes
index_dir: /path/to/dbs
work_dir: /path/to/scratch/boardercollie
fcs_gx_db: /path/to/fcs_gx/gxdb   # ideally a fast local copy for the run: scripts/stage_fcs_gx_db.sh

# Optional: the database build date, if the database folder has no all.meta.jsonl.
# fcs_gx_db_build: "2023-01-24"

# Optional: a folder of FCS-GX reports made earlier, used instead of running FCS-GX.
# Per genome: <accession>.fcs_gx_report.txt and <accession>.taxonomy.rpt
# (or <accession>.<tax-id>.fcs_gx_report.txt and .taxonomy.rpt, as FCS-GX names them).
# Genomes without reports here are screened, which needs fcs_gx_db.
# fcs_gx_reports: /path/to/fcs_gx_reports

# Each host: a name, its genomes, and the reference ladder (comparison genomes).
# The cleaned genomes of a host are joined into one reference named after the host.
# Each genome is an NCBI assembly accession or a local FASTA with its NCBI tax-id.
# A genome's closest relative and the host's ladder are chosen from the NCBI
# taxonomy when left out or set to blank, none, NA or auto; naming an accession
# forces the choice. The ladder lists genomes at increasing distance; the last
# one is the distant reference used by rule 4.
hosts:
  - name: Chlorocebus_spp
    genomes:
      - {accession: GCF_047675955.1}                             # relative chosen automatically
      - {accession: GCA_023783515.1, relative: GCF_047675955.1}  # relative named
      - GCA_963575115.1
    ladder: auto                     # or a list, e.g. [GCA_963574265.1, GCA_000001405.29]
    indexes: [bowtie2, minimap2]
    # reference_out: /path/to/Chlorocebus_spp.fna   # optional: the joined reference also written here
    # bowtie2_out: /path/to/Chlorocebus_spp         # optional: the shared bowtie2 index linked to this stem
    # minimap2_out: /path/to/Chlorocebus_spp.mmi    # optional: the shared minimap2 index linked here
  # An assembly deposited without its mitochondrion can name the species' complete
  # mitochondrial genome (NCBI Nucleotide, e.g. the RefSeq NC_ record); it is added after
  # the genome. It must be a complete mitochondrion of the same species, and the assembly
  # must not already hold one; both are checked and stop the run if they fail.
  # - name: Alouatta_caraya
  #   genomes:
  #     - {accession: GCA_059577405.1, mitochondrion: NC_064185.1}
  #   ladder: auto
  # - name: My_host
  #   genomes:
  #     - {fasta: /path/to/assembly.fna, tax_id: 9534, relative: GCF_047675955.1}
  #   ladder: auto

# Every setting has a default (shown here); remove a line to use the default.
settings:
  download_only: false             # true: download and join the genomes as they are (no FCS-GX, no checks, no cleaning)
  checks:                          # turn single checks off; what a check would have kept goes on to the next ones
    fcs_gx: true                   # off is the same as download_only
    retrovirus: true               # rule 2
    related_genome: true           # rule 3
    lineage_repeat: true           # rule 4
    repeat_family: true            # rule 5 (rules 3 to 5 all off: no alignment steps, no relatives needed)
  keep_taxa: [11632]               # FCS-GX hits within these NCBI taxa are kept untested (11632 = Retroviridae)
  host_like_min: 0.5               # aligned fraction for host_like
  foreign_like_max: 0.1            # aligned fraction below which a region is foreign_like
  embedded_flank_bp: 10000         # a relative match counts when the relative sequence extends this far beyond it on one side
  repeat_trf_min: 0.8              # rule 4: fraction of a region in tandem repeats
  repeat_copy_min_cover: 0.5       # an alignment covering this fraction of a region counts as a copy
  repeat_lineage_rank: genus       # rule 4: where copies are looked for
  family_repeat_min: 0.5           # rule 5: the main repeat must cover this fraction of the region
  family_unit_min_identity: 0.8    # rule 5: unit identity to a confirmed unit
  family_period_tolerance: 0.1     # rule 5: unit lengths may differ by this fraction
  min_tested_length: 300           # shorter regions get FCS-GX's own action (too short to align reliably)
  controls_per_segment: 3          # host controls per flagged region (alignment)
  background_per_segment: 100      # background windows per flagged region (composition)
  control_pass_min: 0.8            # share of host controls that must be host_like
  control_max_n_frac: 0.1          # a control window is redrawn above this fraction of N
  seed: 20261104
  on_controls_failed: fcs_only     # fcs_only or stop
  relative_min_scaffold_n50: 1000000  # automatic choice: relatives and ladder genomes need this scaffold N50
  ladder_ranks: [family, order]    # automatic ladder: one genome per rank, nearest first
  conflict_coding_min: 0.7         # coding fraction reported as a sign of bacterial DNA
  conflict_background_percentiles: [1, 99]
