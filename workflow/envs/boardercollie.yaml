# Everything the workflow runs, pinned. Install, then add the package itself:
#   mamba env create -f workflow/envs/boardercollie.yaml -p <prefix>
#   <prefix>/bin/pip install --no-deps -e .
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake-minimal=9.27.0
  - pyyaml=6.0.3
  - python-edlib=1.3.9.post1
  - ncbi-fcs-gx=0.5.5
  - minimap2=2.28
  - trf=4.09.1
  - bowtie2=2.5.5
