[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardercollie"
dynamic = ["version"]
description = "Screens host genome assemblies for foreign DNA and removes it, for host read removal in metagenomics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "edlib>=1.3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { attr = "boardercollie.__version__" }

[tool.setuptools.packages.find]
include = ["boardercollie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
